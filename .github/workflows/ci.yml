name: ci
# Fail fast: schema, lint and unit tests first; build, image and e2e only after they pass.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Schema matches the committed openapi.json
        run: |
          npx openapi-typescript lib/api/openapi.json -o /tmp/schema.d.ts
          diff /tmp/schema.d.ts lib/api/schema.d.ts
      - run: npm run lint
      - run: npm test

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://brain.opsagent.dev

  docker-build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --build-arg NEXT_PUBLIC_API_BASE_URL=https://brain.opsagent.dev .

  # Full flow against brain main (public repo, no token). PRs only: it compiles brain.
  e2e:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpsAgentDev/opsagent-brain
          path: brain
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: brain
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      # The system libraries come from the Ubuntu mirrors, which runners sometimes cannot reach.
      # The image already carries Chrome's libraries, so fall back to the browser alone.
      - run: timeout 180 npx playwright install --with-deps chromium || npx playwright install chromium
      - run: scripts/e2e.sh
        env:
          BRAIN_DIR: brain
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: |
            brain-e2e.log
            web-e2e.log
            test-results/

  e2e-turnstile:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpsAgentDev/opsagent-brain
          path: brain
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: brain
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      # The system libraries come from the Ubuntu mirrors, which runners sometimes cannot reach.
      # The image already carries Chrome's libraries, so fall back to the browser alone.
      - run: timeout 180 npx playwright install --with-deps chromium || npx playwright install chromium
      # The widget is inlined at build time, so this spec needs its own build with a (stub) site key,
      # and its own runner: a second run in one job meets the first run's web server still on port 3001.
      - run: scripts/e2e.sh auth-turnstile.spec.ts
        env:
          BRAIN_DIR: brain
          E2E_TURNSTILE_SITE_KEY: ci-stub-site-key
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-turnstile-logs
          path: |
            brain-e2e.log
            web-e2e.log
            test-results/
