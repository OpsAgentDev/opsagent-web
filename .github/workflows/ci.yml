name: ci
# Fail fast: schema, lint and unit tests first; build, image and e2e only after they pass.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Schema matches the committed openapi.json
        run: |
          npx openapi-typescript lib/api/openapi.json -o /tmp/schema.d.ts
          diff /tmp/schema.d.ts lib/api/schema.d.ts
      - run: npm run lint
      - run: npm test

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://brain.opsagent.dev

  docker-build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg NEXT_PUBLIC_API_BASE_URL=https://brain.opsagent.dev .

  # Full flow against brain main (public repo, no token). PRs only: it compiles brain.
  e2e:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: OpsAgentDev/opsagent-brain
          path: brain
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: brain
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      # Runner DNS to the Ubuntu mirrors fails now and then: retry before giving up.
      - run: for i in 1 2 3 4 5; do npx playwright install --with-deps chromium && break || { [ $i = 5 ] && exit 1; sleep 30; }; done
      - run: scripts/e2e.sh
        env:
          BRAIN_DIR: brain
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            brain-e2e.log
            web-e2e.log
            test-results/

  e2e-turnstile:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: OpsAgentDev/opsagent-brain
          path: brain
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: brain
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      # Runner DNS to the Ubuntu mirrors fails now and then: retry before giving up.
      - run: for i in 1 2 3 4 5; do npx playwright install --with-deps chromium && break || { [ $i = 5 ] && exit 1; sleep 30; }; done
      # The widget is inlined at build time, so this spec needs its own build with a (stub) site key,
      # and its own runner: a second run in one job meets the first run's web server still on port 3001.
      - run: scripts/e2e.sh auth-turnstile.spec.ts
        env:
          BRAIN_DIR: brain
          E2E_TURNSTILE_SITE_KEY: ci-stub-site-key
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-turnstile-logs
          path: |
            brain-e2e.log
            web-e2e.log
            test-results/
