name: ci
# Fail fast: schema, lint and unit tests first; build, image and e2e only after they pass.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Schema matches the committed openapi.json
        run: |
          npx openapi-typescript lib/api/openapi.json -o /tmp/schema.d.ts
          diff /tmp/schema.d.ts lib/api/schema.d.ts
      - run: npm run lint
      - run: npm test

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://brain.opsagent.dev

  docker-build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg NEXT_PUBLIC_API_BASE_URL=https://brain.opsagent.dev .

  # Full flow against brain main (public repo, no token). PRs only: it compiles brain.
  e2e:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OpsAgentDev/opsagent-brain
          path: brain
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: brain
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: scripts/e2e.sh
        env:
          BRAIN_DIR: brain
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            brain-e2e.log
            web-e2e.log
            test-results/
